<!-- ic_notification.svg (24x24dp, white silhouette) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- SIM card shape -->
  <path d="
    M 4 4
    L 4 20
    L 17 20
    L 17 9
    L 14 4
    Z M 14 4 L 14 9 L 17 9 Z"
    fill="white"/>

  <!-- Chip cutout -->
  <rect x="7" y="10" width="7" height="6" rx="0.5" fill="rgba(0,0,0,0.3)"/>

  <!-- Chip grid lines -->
  <g stroke="white" stroke-width="0.4">
    <line x1="9" y1="10.5" x2="9" y2="15.5"/>
    <line x1="12" y1="10.5" x2="12" y2="15.5"/>
    <line x1="7.5" y1="12.5" x2="13.5" y2="12.5"/>
  </g>
</svg>
