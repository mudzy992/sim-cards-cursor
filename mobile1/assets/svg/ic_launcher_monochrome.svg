<!-- ic_launcher_monochrome.svg (Android 13+ themed icons) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- SIM card outline -->
  <path d="
    M 28 35
    L 28 75
    Q 28 77, 30 77
    L 74 77
    Q 76 77, 76 75
    L 76 43
    L 68 35
    Z M 68 35 L 68 43 L 76 43 Z"
    fill="currentColor"/>

  <!-- Chip area cutout -->
  <rect x="36" y="48" width="28" height="20" rx="2" fill="white" opacity="0.3"/>

  <!-- Chip grid -->
  <g stroke="currentColor" stroke-width="0.8" opacity="0.8">
    <line x1="43" y1="50" x2="43" y2="66"/>
    <line x1="50" y1="50" x2="50" y2="66"/>
    <line x1="57" y1="50" x2="57" y2="66"/>
    <line x1="38" y1="55" x2="62" y2="55"/>
    <line x1="38" y1="61" x2="62" y2="61"/>
  </g>

  <!-- Location pin -->
  <path d="
    M 70 28
    C 62 28, 60 31, 60 35
    C 60 40, 70 48, 70 48
    C 70 48, 80 40, 80 35
    C 80 31, 78 28, 70 28 Z"
    fill="currentColor"/>

  <circle cx="70" cy="35" r="3.5" fill="white"/>
  <circle cx="70" cy="35" r="2" fill="currentColor"/>

  <!-- Signal waves -->
  <g stroke="currentColor" stroke-width="1" fill="none" opacity="0.5">
    <path d="M 21 31 Q 21 28, 24 28" stroke-linecap="round"/>
    <path d="M 18 34 Q 18 28, 24 28" stroke-linecap="round"/>
  </g>
</svg>
