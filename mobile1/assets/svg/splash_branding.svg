<!-- splash_branding.svg (288x288dp) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 288" width="288" height="288">
  <defs>
    <linearGradient id="splashChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="50%" style="stop-color:#FFC107"/>
      <stop offset="100%" style="stop-color:#FF9800"/>
    </linearGradient>
    <linearGradient id="splashPin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF"/>
      <stop offset="100%" style="stop-color:#00BCD4"/>
    </linearGradient>
    <filter id="splashShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Animated pulse rings -->
  <g opacity="0.15" stroke="#2196F3" fill="none">
    <circle cx="144" cy="144" r="120" stroke-width="2" stroke-dasharray="10,8"/>
    <circle cx="144" cy="144" r="90" stroke-width="2" stroke-dasharray="8,6"/>
    <circle cx="144" cy="144" r="60" stroke-width="2" stroke-dasharray="6,4"/>
  </g>

  <!-- Main SIM card -->
  <g transform="translate(144, 144)" filter="splashShadow">
    <!-- Card body -->
    <path d="
      M -70 -90
      L -70 90
      Q -70 95, -65 95
      L 65 95
      Q 70 95, 70 90
      L 70 -55
      L 35 -90
      Z"
      fill="#2196F3"/>

    <!-- White overlay -->
    <path d="
      M -65 -85
      L -65 87
      Q -65 90, -62 90
      L 62 90
      Q 65 90, 65 87
      L 65 -52
      L 32 -85
      Z"
      fill="white" opacity="0.95"/>

    <!-- Corner cut -->
    <path d="M 32 -85 L 32 -52 L 65 -52 Z" fill="rgba(33,150,243,0.2)"/>
    <path d="M 32 -85 L 32 -52 L 65 -52 Z" fill="none" stroke="rgba(33,150,243,0.4)" stroke-width="1.5"/>

    <!-- Chip -->
    <rect x="-35" y="-10" width="70" height="50" rx="4" fill="url(#splashChip)"/>

    <!-- Chip grid -->
    <g stroke="rgba(193,121,0,0.6)" stroke-width="2">
      <line x1="-15" y1="-5" x2="-15" y2="35"/>
      <line x1="0" y1="-5" x2="0" y2="35"/>
      <line x1="15" y1="-5" x2="15" y2="35"/>
      <line x1="-30" y1="8" x2="30" y2="8"/>
      <line x1="-30" y1="22" x2="30" y2="22"/>
    </g>

    <!-- Chip contact pads -->
    <g fill="rgba(193,121,0,0.3)">
      <rect x="-32" y="-3" width="12" height="10" rx="1"/>
      <rect x="-18" y="-3" width="16" height="10" rx="1"/>
      <rect x="12" y="-3" width="16" height="10" rx="1"/>

      <rect x="-32" y="11" width="12" height="14" rx="1"/>
      <rect x="-18" y="11" width="16" height="14" rx="1"/>
      <rect x="12" y="11" width="16" height="14" rx="1"/>

      <rect x="-32" y="27" width="12" height="10" rx="1"/>
      <rect x="-18" y="27" width="16" height="10" rx="1"/>
      <rect x="12" y="27" width="16" height="10" rx="1"/>
    </g>
  </g>

  <!-- Location pin (overlaid) -->
  <g transform="translate(200, 80)" filter="splashShadow">
    <ellipse cx="0" cy="45" rx="12" ry="3" fill="rgba(0,0,0,0.15)"/>

    <path d="
      M 0 0
      C -18 0, -24 8, -24 20
      C -24 35, 0 50, 0 50
      C 0 50, 24 35, 24 20
      C 24 8, 18 0, 0 0 Z"
      fill="url(#splashPin)"
      stroke="white"
      stroke-width="3"/>

    <circle cx="0" cy="19" r="9" fill="white"/>
    <circle cx="0" cy="19" r="5" fill="#2196F3"/>

    <!-- Pulse ring -->
    <circle cx="0" cy="19" r="14" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.5" stroke-dasharray="3,3"/>
  </g>

  <!-- Signal waves -->
  <g opacity="0.3" stroke="#2196F3" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 60 100 Q 40 80, 30 50"/>
    <path d="M 230 100 Q 250 80, 260 50"/>
  </g>

  <!-- Text labels -->
  <text x="144" y="250"
        font-family="-apple-system, 'SF Pro Display', Arial, sans-serif"
        font-weight="700"
        font-size="32"
        fill="#2196F3"
        text-anchor="middle"
        letter-spacing="4">
    SIM CARD
  </text>
  <text x="144" y="275"
        font-family="-apple-system, 'SF Pro Display', Arial, sans-serif"
        font-weight="500"
        font-size="24"
        fill="#1976D2"
        text-anchor="middle"
        letter-spacing="6"
        opacity="0.8">
    TRACKER
  </text>
</svg>
