## BACKUP / ARHIVA — NIJE AKTIVAN
## VM je prešao isključivo na PostgreSQL (vidi docker-compose.vm.db.yml).
## Ovaj fajl je zadržan samo kao rollback referenca za stari MySQL setup
## na VM-u. NE pokretati zajedno sa docker-compose.vm.db.yml (isti network
## "sim-tracker-net", moguć konflikt naziva kontejnera/servisa ako se oba
## dignu istovremeno).
services:
  mysql:
    container_name: sim-tracker-mysql
    image: mysql:8.4
    restart: unless-stopped
    environment:
      # PREPORUKA: ove vrijednosti postaviti kroz .env fajl na VM-u
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-nije,kikiriki}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-sim_cards}
      - MYSQL_USER=${MYSQL_USER:-sim_app}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-nije,kikiriki}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app

  dbadmin:
    container_name: sim-tracker-dbadmin
    image: phpmyadmin:5-apache
    restart: unless-stopped
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_ARBITRARY=0
      - PMA_ABSOLUTE_URI=${PMA_ABSOLUTE_URI:-http://10.10.10.30/dbadmin/}
      # Upload limita (po potrebi za import)
      - UPLOAD_LIMIT=256M
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./dbadmin/apache-servername.conf:/etc/apache2/conf-enabled/servername.conf:ro
    networks:
      - app
    labels:
      - traefik.enable=true
      - "traefik.http.routers.sim_dbadmin.rule=(Host(`ep-web-sim`) || Host(`10.10.10.30`)) && PathPrefix(`/dbadmin`)"
      - traefik.http.routers.sim_dbadmin.entrypoints=web
      - traefik.http.routers.sim_dbadmin.priority=30
      - traefik.http.routers.sim_dbadmin.middlewares=sim_dbadmin_stripprefix
      - traefik.http.routers.sim_dbadmin.service=sim_dbadmin_svc
      - traefik.http.middlewares.sim_dbadmin_stripprefix.stripprefix.prefixes=/dbadmin
      - traefik.http.services.sim_dbadmin_svc.loadbalancer.server.port=80

networks:
  app:
    external: true
    name: sim-tracker-net

volumes:
  mysql-data:
    driver: local
