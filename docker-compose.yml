services:
  backend:
    container_name: sim-tracker-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MYSQL_BACKUP_DATABASE_URL: ${MYSQL_BACKUP_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      PORT: ${PORT}
      FRONTEND_URLS: ${FRONTEND_URLS}
      UPLOAD_ROOT_PATH: ${UPLOAD_ROOT_PATH}
      UPLOAD_PUBLIC_PREFIX: ${UPLOAD_PUBLIC_PREFIX}
      APP_ENV: ${APP_ENV}
      THROTTLE_TTL: ${THROTTLE_TTL}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME}
      SWAGGER_PUBLIC_BASE_PATH: ${SWAGGER_PUBLIC_BASE_PATH}
    volumes:
      - /mnt/shared-app-files/sim-cards-codex:/usr/app/uploads
    networks:
      - db_net
    expose:
      - "3003"

  frontend:
    container_name: sim-tracker-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_API_BASE_URLS: ${VITE_API_BASE_URLS}
    restart: unless-stopped
    expose:
      - "80"

networks:
  db_net:
    external: true
