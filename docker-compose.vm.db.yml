services:
  postgres:
    container_name: sim-tracker-postgres
    image: postgres:16-alpine
    init: true
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-sim_cards}
      - POSTGRES_USER=${POSTGRES_USER:-sim_app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sim_app} -d ${POSTGRES_DB:-sim_cards}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app

  dbadmin:
    container_name: sim-tracker-dbadmin
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    mem_limit: 512m
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@simtracker.local}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
      - SCRIPT_NAME=/dbadmin
      - PGADMIN_LISTEN_PORT=80
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - app
    labels:
      - traefik.enable=true
      - "traefik.http.routers.sim_dbadmin.rule=(Host(`ep-web-sim`) || Host(`10.10.10.30`)) && PathPrefix(`/dbadmin`)"
      - traefik.http.routers.sim_dbadmin.entrypoints=web
      - traefik.http.routers.sim_dbadmin.priority=30
      - traefik.http.routers.sim_dbadmin.service=sim_dbadmin_svc
      - traefik.http.services.sim_dbadmin_svc.loadbalancer.server.port=80

networks:
  app:
    external: true
    name: sim-tracker-net

volumes:
  postgres-data:
    driver: local
  pgadmin-data:
    driver: local
