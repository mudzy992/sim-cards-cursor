<!-- ic_launcher_foreground.svg (Safe zone: 72x72 centered in 108x108) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="fgChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FF9800"/>
    </linearGradient>
    <linearGradient id="fgPin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5FF"/>
      <stop offset="100%" style="stop-color:#00BCD4"/>
    </linearGradient>
    <filter id="fgShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Content centered in safe zone (18,18 to 90,90) -->

  <!-- SIM Card body -->
  <g filter="fgShadow">
    <path d="
      M 28 35
      L 28 75
      Q 28 77, 30 77
      L 74 77
      Q 76 77, 76 75
      L 76 43
      L 68 35
      Z"
      fill="white" opacity="0.95"/>

    <!-- Corner cut -->
    <path d="M 68 35 L 68 43 L 76 43 Z" fill="rgba(33,150,243,0.25)"/>
  </g>

  <!-- Chip contacts -->
  <rect x="36" y="48" width="28" height="20" rx="2" fill="url(#fgChip)"/>
  <g stroke="rgba(193,121,0,0.5)" stroke-width="0.8" opacity="0.7">
    <line x1="43" y1="50" x2="43" y2="66"/>
    <line x1="50" y1="50" x2="50" y2="66"/>
    <line x1="57" y1="50" x2="57" y2="66"/>
    <line x1="38" y1="55" x2="62" y2="55"/>
    <line x1="38" y1="61" x2="62" y2="61"/>
  </g>

  <!-- Location pin -->
  <g transform="translate(70, 28)">
    <path d="
      M 0 0
      C -8 0, -10 3, -10 7
      C -10 12, 0 20, 0 20
      C 0 20, 10 12, 10 7
      C 10 3, 8 0, 0 0 Z"
      fill="url(#fgPin)"
      stroke="white"
      stroke-width="1.2"/>

    <circle cx="0" cy="7" r="3.5" fill="white"/>
    <circle cx="0" cy="7" r="2" fill="#2196F3"/>
  </g>

  <!-- Small signal indicator -->
  <g transform="translate(24, 28)" opacity="0.5">
    <circle cx="0" cy="0" r="1.5" fill="#00E5FF"/>
    <path d="M -3 -3 Q -1 -1, 0 0" stroke="#00E5FF" stroke-width="0.8" fill="none" stroke-linecap="round"/>
    <path d="M 3 -3 Q 1 -1, 0 0" stroke="#00E5FF" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
