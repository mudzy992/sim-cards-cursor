<!-- favicon-32.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg32" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3"/>
      <stop offset="100%" style="stop-color:#1976D2"/>
    </linearGradient>
    <linearGradient id="chip32" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FF9800"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="6" fill="url(#bg32)"/>

  <!-- Simplified SIM card -->
  <path d="M 6 8 L 6 24 Q 6 25, 7 25 L 23 25 Q 24 25, 24 24 L 24 11 L 21 8 Z"
        fill="white" opacity="0.95"/>
  <path d="M 21 8 L 21 11 L 24 11 Z" fill="rgba(33,150,243,0.3)"/>

  <!-- Chip -->
  <rect x="9" y="12" width="10" height="8" rx="1" fill="url(#chip32)"/>
  <g stroke="rgba(193,121,0,0.5)" stroke-width="0.5">
    <line x1="11.5" y1="13" x2="11.5" y2="19"/>
    <line x1="16.5" y1="13" x2="16.5" y2="19"/>
    <line x1="10" y1="15" x2="18" y2="15"/>
    <line x1="10" y1="17" x2="18" y2="17"/>
  </g>

  <!-- Location pin -->
  <path d="M 24 6 C 21 6, 20 7, 20 9 C 20 11, 24 15, 24 15 C 24 15, 28 11, 28 9 C 28 7, 27 6, 24 6 Z"
        fill="#00E5FF" stroke="white" stroke-width="0.8"/>
  <circle cx="24" cy="9" r="2" fill="white"/>
</svg>
