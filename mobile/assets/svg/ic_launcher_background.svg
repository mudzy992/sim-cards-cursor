<!-- ic_launcher_background.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="adaptBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3"/>
      <stop offset="100%" style="stop-color:#1976D2"/>
    </linearGradient>
    <radialGradient id="pulseGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#00E5FF;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00E5FF;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="108" height="108" fill="url(#adaptBg)"/>

  <!-- Pulse circles -->
  <circle cx="54" cy="54" r="45" fill="url(#pulseGrad)"/>
  <circle cx="54" cy="54" r="35" fill="none" stroke="rgba(0,229,255,0.15)" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="54" cy="54" r="25" fill="none" stroke="rgba(0,229,255,0.1)" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
