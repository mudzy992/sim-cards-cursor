services:
  backend:
    container_name: sim-tracker-backend-vm
    build:
      context: ./backend
      dockerfile: Dockerfile.vm
      args:
        # Tag deps image-a koji je već učitan lokalno na VM-u (docker load) —
        # vidi scripts/vm-deps-build.sh / vm-deps-load.sh i
        # backend/Dockerfile.deps. Podesiti kroz .env (DEPS_IMAGE_TAG) ili
        # override-ovati u komandnoj liniji (--build-arg).
        - DEPS_IMAGE=${DEPS_IMAGE_TAG:-simtracker-backend-deps:latest}
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sim_app}:${POSTGRES_PASSWORD:-nije,kikiriki}@sim-tracker-postgres:5432/${POSTGRES_DB:-sim_cards}
    # NEMA depends_on ka postgres/dbadmin — ti servisi su definisani u
    # docker-compose.vm.db.yml (odvojen fajl/projekat). `depends_on` u
    # Compose-u referencira servis unutar ISTOG seta -f fajlova koji se
    # zajedno prosljeđuju datoj komandi; kad se ovaj fajl pokreće sam
    # (`docker compose -f docker-compose.vm.app.yml up -d backend`), Compose
    # ne vidi "postgres" servis uopšte i baca "undefined service" grešku
    # (bez obzira na naziv/hostname). U praksi Postgres je dugotrajno
    # pokrenut i rijetko se restartuje, pa ovo nije problem u svakodnevnom
    # radu. Ako ipak treba garantovano čekanje na zdrav Postgres prije
    # starta backend-a, pokrenuti oba fajla zajedno u jednoj komandi:
    #   docker compose -f docker-compose.vm.db.yml -f docker-compose.vm.app.yml up -d backend
    # (tada depends_on iz app.yml postaje validan jer Compose spaja oba
    # fajla u jedan projekat).
    volumes:
      # Globalno pravilo za upload mount
      - /mnt/shared-app-files/sim-cards:/usr/app/uploads
    networks:
      - app
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const req = http.get('http://127.0.0.1:3003/api/docs', (res) => { process.exit(res.statusCode >= 200 && res.statusCode < 400 ? 0 : 1); }); req.on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 10

    labels:
      - traefik.enable=true

      # Backend HTTP: public /backend/* -> internal /* (Nest stays on /api)
      - "traefik.http.routers.sim_backend.rule=(Host(`ep-sim.epbih.ba`) || Host(`10.50.255.189`) || Host(`ep-web-sim`) || Host(`10.10.10.30`)) && (PathPrefix(`/backend`) || PathPrefix(`/api`))"
      - traefik.http.routers.sim_backend.entrypoints=web
      - traefik.http.routers.sim_backend.priority=10
      - traefik.http.routers.sim_backend.middlewares=sim_backend_stripprefix
      - traefik.http.routers.sim_backend.service=sim_backend_svc
      - traefik.http.middlewares.sim_backend_stripprefix.stripprefix.prefixes=/backend
      - traefik.http.services.sim_backend_svc.loadbalancer.server.port=3003

      # Socket.io: keep path /api/socket.io (hardcoded in FE + BE)
      - "traefik.http.routers.sim_socket.rule=(Host(`ep-sim.epbih.ba`) || Host(`10.50.255.189`) || Host(`ep-web-sim`) || Host(`10.10.10.30`)) && PathPrefix(`/api/socket.io`)"
      - traefik.http.routers.sim_socket.entrypoints=web
      - traefik.http.routers.sim_socket.priority=20
      - traefik.http.routers.sim_socket.service=sim_backend_svc

      # Swagger docs assets: /api/docs/* must go to backend (otherwise frontend catches it)
      - "traefik.http.routers.sim_docs.rule=(Host(`ep-sim.epbih.ba`) || Host(`10.50.255.189`) || Host(`ep-web-sim`) || Host(`10.10.10.30`)) && PathPrefix(`/api/docs`)"
      - traefik.http.routers.sim_docs.entrypoints=web
      - traefik.http.routers.sim_docs.priority=25
      - traefik.http.routers.sim_docs.service=sim_backend_svc

  frontend:
    container_name: sim-tracker-frontend-vm
    build:
      context: ./frontend
      dockerfile: Dockerfile.vm
      # Nema build args ovdje — VITE_API_BASE_URL/VITE_API_BASE_URLS su već
      # "upečeni" u ./frontend/dist prilikom `npm run build` koraka koji se
      # radi UNAPRIJED na mašini sa internetom (scripts/vm-frontend-build.sh).
      # Ovaj build korak samo kopira taj gotov dist/ u nginx image — bez
      # interneta, bez node-a.
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app
    labels:
      - traefik.enable=true
      - "traefik.http.routers.sim_frontend.rule=(Host(`ep-sim.epbih.ba`) || Host(`10.50.255.189`) || Host(`ep-web-sim`) || Host(`10.10.10.30`)) && PathPrefix(`/`)"
      - traefik.http.routers.sim_frontend.entrypoints=web
      - traefik.http.routers.sim_frontend.priority=1
      - traefik.http.routers.sim_frontend.service=sim_frontend_svc
      - traefik.http.services.sim_frontend_svc.loadbalancer.server.port=3004

networks:
  app:
    external: true
    name: sim-tracker-net
