services:
  mysql:
    container_name: sim-tracker-mysql
    image: mysql:8.4
    restart: unless-stopped
    environment:
      # PREPORUKA: ove vrijednosti postaviti kroz .env fajl na VM-u
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-change_me_root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-CHANGE_ME_DB_NAME}
      - MYSQL_USER=${MYSQL_USER:-sim_app}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-change_me_app_pass}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app
    ports:
      # Ako MySQL treba biti dostupan i sa hosta
      - "3306:3306"

  backend:
    container_name: sim-tracker-backend-vm
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # Globalno pravilo za upload mount
      - /mnt/shared-app-files/sim-cards:/usr/app/uploads
    ports:
      - "3003:3003"
    networks:
      - app

  frontend:
    container_name: sim-tracker-frontend-vm
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # FE ide na port 3004a vidjeti da li smijemo na 80
      - "3004:3004"
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  mysql-data:
    driver: local
