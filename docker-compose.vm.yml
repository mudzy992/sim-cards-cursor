services:
  traefik:
    container_name: sim-tracker-traefik-vm
    image: traefik:latest
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --accesslog=true
      - --log.level=INFO
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app

  mysql:
    container_name: sim-tracker-mysql
    image: mysql:8.4
    restart: unless-stopped
    environment:
      # PREPORUKA: ove vrijednosti postaviti kroz .env fajl na VM-u
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-nije,kikiriki}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-sim_cards}
      - MYSQL_USER=${MYSQL_USER:-sim_app}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-nije,kikiriki}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app

  dbadmin:
    container_name: sim-tracker-dbadmin
    image: phpmyadmin:5-apache
    restart: unless-stopped
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_ARBITRARY=0
      # Upload limita (po potrebi za import)
      - UPLOAD_LIMIT=256M
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./dbadmin/apache-servername.conf:/etc/apache2/conf-enabled/servername.conf:ro
    networks:
      - app
    labels:
      - traefik.enable=true
      - "traefik.http.routers.sim_dbadmin.rule=(Host(`ep-web-sim`) || Host(`10.10.10.30`)) && PathPrefix(`/dbadmin`)"
      - traefik.http.routers.sim_dbadmin.entrypoints=web
      - traefik.http.routers.sim_dbadmin.priority=30
      - traefik.http.routers.sim_dbadmin.middlewares=sim_dbadmin_stripprefix
      - traefik.http.routers.sim_dbadmin.service=sim_dbadmin_svc
      - traefik.http.middlewares.sim_dbadmin_stripprefix.stripprefix.prefixes=/dbadmin
      - traefik.http.services.sim_dbadmin_svc.loadbalancer.server.port=80

  backend:
    container_name: sim-tracker-backend-vm
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    environment:
      - DATABASE_URL=mysql://${MYSQL_USER:-sim_app}:${MYSQL_PASSWORD:-nije,kikiriki}@mysql:3306/${MYSQL_DATABASE:-sim_cards}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # Globalno pravilo za upload mount
      - /mnt/shared-app-files/sim-cards:/usr/app/uploads
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true

      # Backend HTTP: public /backend/* -> internal /* (Nest stays on /api)
      - "traefik.http.routers.sim_backend.rule=(Host(`ep-web-sim`) || Host(`10.10.10.30`)) && PathPrefix(`/backend`)"
      - traefik.http.routers.sim_backend.entrypoints=web
      - traefik.http.routers.sim_backend.priority=10
      - traefik.http.routers.sim_backend.middlewares=sim_backend_stripprefix
      - traefik.http.routers.sim_backend.service=sim_backend_svc
      - traefik.http.middlewares.sim_backend_stripprefix.stripprefix.prefixes=/backend
      - traefik.http.services.sim_backend_svc.loadbalancer.server.port=3003

      # Socket.io: keep path /api/socket.io (hardcoded in FE + BE)
      - "traefik.http.routers.sim_socket.rule=(Host(`ep-web-sim`) || Host(`10.10.10.30`)) && PathPrefix(`/api/socket.io`)"
      - traefik.http.routers.sim_socket.entrypoints=web
      - traefik.http.routers.sim_socket.priority=20
      - traefik.http.routers.sim_socket.service=sim_backend_svc

  frontend:
    container_name: sim-tracker-frontend-vm
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app
    labels:
      - traefik.enable=true
      - "traefik.http.routers.sim_frontend.rule=(Host(`ep-web-sim`) || Host(`10.10.10.30`)) && PathPrefix(`/`)"
      - traefik.http.routers.sim_frontend.entrypoints=web
      - traefik.http.routers.sim_frontend.priority=1
      - traefik.http.routers.sim_frontend.service=sim_frontend_svc
      - traefik.http.services.sim_frontend_svc.loadbalancer.server.port=3004

networks:
  app:
    driver: bridge
    name: sim-tracker-net

volumes:
  mysql-data:
    driver: local
